name = "FP"
version = "0.1.0"
description = "Lean proofs for IEEE 754 arithmetic and floating-point numerical analysis"
license = "Apache-2.0"
homepage = "https://github.com/tunnellm/lean-ieee754"
keywords = ["floating-point", "numerical-analysis", "ieee754", "formal-verification"]
defaultTargets = ["FP", "FP.Verification"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[lean_lib]]
name = "FP"

[[lean_exe]]
name = "fp"
root = "Main"
